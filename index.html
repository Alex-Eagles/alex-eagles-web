<!doctype html>
<!--
  `data-theme` is set to "dark" up-front so the very first paint is already dark
  (dark is the brand default). ThemeContext re-reads localStorage on mount and
  corrects this to the user's saved preference before the page becomes interactive,
  which avoids a light-mode "flash" for returning light-mode users.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      favicon-logo.ico, rebuilt rather than replaced: it used to hold a single
      256x256 uncompressed BMP, so every browser downscaled that one bitmap
      itself to 16 or 32px — which is where the soft tab icon came from. It now
      packs real PNGs at 16/32/48/64/128/256, so each size is a proper resample,
      and the file is smaller for it (264 KB -> 45 KB). Same path, and the type
      now actually matches what's there.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon-logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Tints the browser's own chrome — on iOS this is what stops Safari drawing
      its default toolbar material over the page, which showed up as a pale band
      fading in at the bottom of the screen.

      It has to be here, in the served HTML, not added by JS on mount: Safari
      decides how to draw that chrome on the first paint, and a meta tag that
      arrives after React has mounted is already too late. Matches the dark
      --bg-primary, the same default `data-theme` above commits to;
      ThemeContext keeps it in sync when the user toggles.
    -->
    <meta name="theme-color" content="#07091c" />
    <meta
      name="description"
      content="Alex Eagles — Alexandria University"
    />
    <title>Alex Eagles</title>

    <!-- Fonts: Barlow Condensed (display), Barlow (headings), Inter (body/UI),
         JetBrains Mono (specs), Archivo (Team page), Alfa Slab One (Homepage
         titles), Orbitron (Hero "ALEX EAGLES"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Hero footage is served from Cloudinary; get the DNS and TLS handshake
         started during parse instead of when the <video> mounts. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
