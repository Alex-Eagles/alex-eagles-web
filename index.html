<!doctype html>
<!--
  `data-theme` is set to "dark" up-front so the very first paint is already dark
  (dark is the brand default). ThemeContext re-reads localStorage on mount and
  corrects this to the user's saved preference before the page becomes interactive,
  which avoids a light-mode "flash" for returning light-mode users.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Alex Eagles — Alexandria University's Unmanned Aerial Systems team engineering precision flight for the SUAS competition."
    />
    <title>Alex Eagles · Alexandria University SUAS Team</title>

    <!-- Fonts: Barlow Condensed (display), Barlow (headings), Inter (body/UI), JetBrains Mono (specs). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
