<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- candidate models (left column) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <g transform="translate(90,90)">
      <rect x="0" y="0" width="120" height="90" rx="14" fill="#F6D9E5" stroke="#F4A9C6" stroke-width="2"/>
      <circle cx="60" cy="34" r="16" fill="#E8749E"/>
      <rect x="30" y="58" width="60" height="8" rx="4" fill="#C24E77"/>
      <text x="60" y="118" text-anchor="middle" font-size="15" fill="#4B1528">Model A</text>
    </g>
    <g transform="translate(90,225)">
      <rect x="0" y="0" width="120" height="90" rx="14" fill="#F6D9E5" stroke="#F4A9C6" stroke-width="2"/>
      <circle cx="60" cy="34" r="16" fill="#E8749E"/>
      <rect x="30" y="58" width="60" height="8" rx="4" fill="#C24E77"/>
      <text x="60" y="118" text-anchor="middle" font-size="15" fill="#4B1528">Model B</text>
    </g>
    <g transform="translate(90,360)">
      <rect x="0" y="0" width="120" height="90" rx="14" fill="#F6D9E5" stroke="#F4A9C6" stroke-width="2"/>
      <circle cx="60" cy="34" r="16" fill="#E8749E"/>
      <rect x="30" y="58" width="60" height="8" rx="4" fill="#C24E77"/>
      <text x="60" y="118" text-anchor="middle" font-size="15" fill="#4B1528">Model C</text>
    </g>
  </g>

  <!-- arrows into the screening gate -->
  <g stroke="#B9BFC9" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <path d="M215,135 L330,225"/>
    <path d="M215,270 L330,270"/>
    <path d="M215,405 L330,315"/>
  </g>

  <!-- screening gate -->
  <g transform="translate(340,180)" font-family="Arial, Helvetica, sans-serif">
    <circle cx="90" cy="90" r="90" fill="#DEEFE8" stroke="#7FCBAE" stroke-width="3"/>
    <g stroke="#1C7A55" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M55,90 l24,24 l46,-52"/>
    </g>
    <text x="90" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#0C5744">SCREENING</text>
    <text x="90" y="172" text-anchor="middle" font-size="12" fill="#3C8768">speed · accuracy · footprint</text>
  </g>

  <!-- arrow to selected model -->
  <path d="M530,270 L660,270" stroke="#B9BFC9" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- selected baseline model -->
  <g transform="translate(680,195)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="150" height="150" rx="20" fill="#D5E7F7" stroke="#6AA8E0" stroke-width="3"/>
    <circle cx="75" cy="55" r="26" fill="#2F6FB8"/>
    <path d="M62,55 l10,10 l20,-22" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="75" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">BASELINE</text>
    <text x="75" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">MODEL</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B9BFC9"/>
    </marker>
  </defs>
</svg>
